<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mercari Bundle Extractor</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div><h1>Mercari Bundle Extractor</h1><p>Sales Report → Bundle 明细 → 合并 CSV</p></div><span>v2.1</span></header><main>
<section class="card"><label class="upload"><input id="file" type="file" accept=".csv,text/csv"><span>选择 Mercari Sales Report CSV</span></label><div id="importInfo" class="muted">自动筛选标题以 “Bundle for” 开头的订单。</div></section>
<section class="stats"><div><b id="total">0</b><span>Bundle</span></div><div><b id="done">0</b><span>完成</span></div><div><b id="pending">0</b><span>待处理</span></div><div><b id="issues">0</b><span>需检查</span></div></section>
<section class="card"><div class="progress"><div id="bar"></div></div><p id="message">尚未导入 Sales Report。</p><div class="actions"><button id="start" class="primary">开始 / 继续</button><button id="pause">暂停</button><button id="retry">重试失败项</button></div></section>
<section class="card"><strong>选择导出内容</strong><label class="choice"><input type="radio" name="exportMode" value="bundle" checked><span><b>仅 Bundle 商品明细</b><small>与当前版本相同，只包含 Bundle 内商品。</small></span></label><label class="choice"><input type="radio" name="exportMode" value="all"><span><b>全部售出商品（Cost Mapping）</b><small>普通订单保留一行，Bundle 按实际商品逐件展开。</small></span></label><button id="export" class="success wide">下载所选 CSV</button><div><button id="exportQueue" class="linkBtn">下载 Bundle 状态表</button><button id="clear" class="danger linkBtn">清空本月数据</button></div></section>
<details><summary>订单状态</summary><div id="queue" class="queue"></div></details></main><script src="popup.js"></script></body></html>
